name: Build native releases
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: linux-x64}
          - {runner: ubuntu-22.04-arm, target: linux-arm64}
          - {runner: windows-2022, target: windows-x64}
          - {runner: macos-15-intel, target: macos-x64}
          - {runner: macos-14, target: macos-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$Errors) | Out-Null
          if ($Errors.Count) { throw ($Errors | Out-String) }
      - run: python scripts/build.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
  draft-release:
    needs: build
    runs-on: ubuntu-22.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: true}
      - name: Assemble checksums and installer scripts
        run: |
          cat artifacts/*.sha256 > artifacts/SHA256SUMS
          cp install.sh install.ps1 artifacts/
          rm artifacts/*.sha256
      - name: Create versioned draft if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v$(python -c 'from runtime import VERSION; print(VERSION)')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo 'El tag debe coincidir con runtime.VERSION.' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "La release $RELEASE_TAG ya existe; no se modifica. Los nuevos builds quedan como artifacts."
            exit 0
          fi
          gh release create "$RELEASE_TAG" artifacts/* --target "$GITHUB_SHA" --draft --title "CreateApp $RELEASE_TAG" --generate-notes
